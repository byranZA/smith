name: CI

# Green-main gate: run the same `make check` a developer runs locally, on every
# PR and on pushes to main. Kept separate from the tag-triggered release pipeline
# so a broken test surfaces at merge, not at the moment we try to ship.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release with the toolchain the module declares, not a floating "stable".
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install golangci-lint onto PATH so `make lint` actually runs. Locally it
      # skips with a note when absent; in CI that would make linting a silent
      # no-op, so the gate installs it (pinned, matching .golangci.yml version 2).
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      # Enforce tidiness here — the release pipeline deliberately omits
      # `go mod tidy` (it mutates go.mod/go.sum mid-release). A drift fails CI.
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # fmt-check + vet + lint + test — identical to the local gate.
      - name: make check
        run: make check
