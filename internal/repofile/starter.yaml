# The repo file: the loop settings everyone running `smith loop` on this repo
# shares. Commit it. A setting left commented out uses smith's built-in
# default. For one run, `smith loop run --agent`, `--model` and `--effort`
# change the work role's preset and `--no-push` turns pushing off, without
# editing this file.

# The agent settings this repo runs on, each a named preset: the coding agent
# (claude, codex or pi), the model it runs, passed to it verbatim, and how hard
# it thinks (low, medium or high). A preset that leaves out its model or effort
# leaves it to the agent's own default. Name presets as you like, in lowercase
# letters, digits and hyphens, and define as many as you need.
presets:
  claude:
    agent: claude
    # model: opus
    # effort: high

# The preset each role runs on. work, the only role, works each task, attached
# or not. Unset, it runs claude with the agent's own model and effort.
roles:
  work: claude

# Whether the loop pushes the work branch to origin, under its own name, after
# each task it lands. Unset, it pushes; `smith loop run --no-push` turns it off
# for one run.
# push: false

# The command that prepares a worktree of this repo, run with `sh -c` in the
# worktree under the toolchain its mise config pins. It must be safe to re-run.
# Unset, no command runs.
# prepare: uv sync

# The tracker's triage labels: the one that marks a task for an agent, the one
# that marks it for a human (where a task the loop skips goes), and the one
# that marks a spec not yet split into tasks. Set only those this repo names
# differently; the rest keep the defaults shown. `smith loop run` warns of any
# label set here that the repo does not have.
# labels:
#   agent: ready-for-agent
#   human: ready-for-human
#   spec: spec
